<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light"><title>すぐ埋まる？ナビ</title><style>
:root{
  --brand:#8B1E3F; --brand-soft:#fdf2f5; --brand-line:#f1c5d2;
  --ink:#1f2937; --sub:#4b5563; --mute:#6b7280; --line:#e5e7eb;
  --bg:#f3f4f6; --card:#fff; --nav-h:64px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#e5e7eb;color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  font-size:14px;line-height:1.6}
button,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;
  box-shadow:0 0 30px rgba(0,0,0,.12);padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
#app.detail{padding-bottom:calc(84px + env(safe-area-inset-bottom))}

/* デモ表示 */
.demo{background:#fff7ed;border-bottom:1px solid #fed7aa;color:#9a3412;font-size:12px;
  padding:8px 12px;display:flex;gap:8px;align-items:flex-start}
.demo button{margin-left:auto;min-width:44px;min-height:32px;color:#9a3412;font-weight:700}

/* ヘッダー */
.top{background:#fff;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:10px;width:calc(100% - 24px);margin:10px 12px 10px;
  min-height:52px;padding:8px 14px;background:#f9fafb;border:1px solid var(--line);border-radius:999px;text-align:left}
.search .t{flex:1;min-width:0}
.search .t b{display:block;font-size:14px}
.search .t span{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:6px;padding:6px 12px 10px}
.seg button{flex:1;min-height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;
  font-weight:700;font-size:13px;color:var(--sub)}
.seg button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.seg small{font-weight:500;font-size:12px;margin-left:2px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line)}
.bar .n{font-weight:700}
.bar .n em{font-style:normal;color:var(--brand);font-size:18px}
.sort{min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13px}

/* 凡例 */
.legend{margin:10px 12px 0;padding:8px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:12px;color:var(--sub)}
.legend b{color:var(--ink)}
.legend button{color:var(--brand);font-weight:700;text-decoration:underline;min-height:32px}

/* 物件カード */
.list{padding:12px;display:grid;gap:14px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card a{display:block}
.card a:active{background:#fafafa}
.photo{height:150px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;
  color:rgba(255,255,255,.92);letter-spacing:.05em}
.card .body{padding:12px 14px 14px}
.price{display:flex;align-items:baseline;justify-content:space-between}
.price b{font-size:22px}.price b small{font-size:13px;font-weight:500}
.price span{font-size:12px;color:var(--mute)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tags span{background:#f3f4f6;color:var(--sub);padding:2px 8px;border-radius:6px;font-size:12px}
.sta{font-size:13px;color:var(--sub)}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid #f3f4f6}
.foot .d{font-size:12px;color:var(--mute)}
.foot .mk{display:flex;align-items:center;gap:6px}
.foot .cap{font-size:12px;color:var(--sub)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;font-weight:700;font-size:13px;border:1px solid}
.badge svg{width:14px;height:14px}
.badge.hi{background:var(--brand-soft);color:var(--brand);border-color:var(--brand-line)}
.badge.lo{background:#f3f4f6;color:#374151;border-color:#d1d5db}
.heart{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);
  display:flex;align-items:center;justify-content:center;color:#6b7280;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.heart svg{width:22px;height:22px}
.heart[aria-pressed=true]{color:var(--brand)}
.heart[aria-pressed=true] svg{fill:currentColor}

.empty{margin:40px 20px;text-align:center;color:var(--sub)}
.empty button,.btn{min-height:48px;padding:0 20px;border-radius:12px;background:var(--brand);color:#fff;font-weight:700}
.empty p{margin:0 0 14px}

/* 下のナビ */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:flex;z-index:30}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--mute);font-weight:500}
.nav a[aria-current=page]{color:var(--brand);font-weight:700}
.nav svg{width:24px;height:24px}
.nav i{font-style:normal;background:var(--brand);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;margin-left:4px}

/* 詳細 */
.hero{height:230px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;color:rgba(255,255,255,.92);position:relative}
.back{position:absolute;top:12px;left:12px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.back svg{width:22px;height:22px}
.sheet-top{background:#fff;margin-top:-20px;border-radius:20px 20px 0 0;position:relative;padding:18px 16px 4px}
.sheet-top h1{margin:0;font-size:30px;line-height:1.1}.sheet-top h1 small{font-size:16px;font-weight:500}
.sheet-top .sub{margin:6px 0 0;font-size:13px;color:var(--mute)}
dl.spec{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:16px 0;font-size:14px}
dl.spec dt{color:var(--mute)}dl.spec dd{margin:0}
.panel{background:#fff;padding:4px 16px 20px}
.panel h2{display:flex;align-items:center;justify-content:space-between;font-size:16px;margin:12px 0}
.info{min-width:44px;min-height:44px;color:var(--mute);display:flex;align-items:center;justify-content:center}
.info svg{width:22px;height:22px}
.mark{border:1px solid var(--brand-line);background:var(--brand-soft);border-radius:14px;padding:14px}
.mark.lo{border-color:var(--line);background:#f9fafb}
.mark .row{display:flex;align-items:center;gap:10px}
.mark .row span.t{font-size:14px}
.rec{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.rec h3{margin:0 0 8px;font-size:13px;color:var(--sub)}
.rec .r{margin:10px 0;font-size:13px}
.rec .r>span{display:block;color:var(--sub);margin-bottom:2px}
.more{margin-top:4px}
.more summary{min-height:44px;display:flex;align-items:center;gap:6px;color:var(--brand);font-weight:700;font-size:13px;cursor:pointer;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:"▼";font-size:9px}
.more[open] summary::after{content:"▲"}
.more p{margin:6px 0;font-size:13px;color:var(--sub)}
.more .cond{font-weight:700;color:var(--ink)}
.more .lead{margin:6px 0 4px}
.rec .key{margin:6px 0 0;font-size:15px;font-weight:700;color:var(--ink)}
.mark .note{margin:8px 0 0}
.rec .lead{margin:0 0 8px;font-size:13px;color:var(--sub)}
.rec .bar2{display:flex;align-items:center;gap:8px;min-height:22px}
.rec .bar2 i{flex:none;display:block;height:16px;border-radius:4px;background:var(--brand);width:max(4px,calc((100% - 9.5em) * var(--w)))}
.rec .bar2 b{font-size:12px;white-space:nowrap}
.rec .n{font-size:12px;color:var(--mute);margin:6px 0 0}
.note{font-size:12px;color:var(--mute);margin:10px 0 0}
.cta{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:30}
.cta .heart{position:static;box-shadow:none;border:1px solid var(--line);border-radius:12px;width:56px;height:52px;background:#fff}
.cta .btn{flex:1;min-height:52px;font-size:16px}

/* キープ比較 */
.cmp{margin:0 12px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#f9fafb;color:var(--sub);font-weight:700;font-size:12px}
tr:last-child td{border-bottom:0}
.h2{margin:14px 12px 0;font-size:15px}

/* ダイアログ */
dialog{border:0;padding:0;color:var(--ink);background:#fff}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;width:100%;max-width:480px;max-height:88dvh;border-radius:20px 20px 0 0;overflow:auto}
dialog.full{position:fixed;inset:0;margin:0 auto;width:100%;max-width:480px;height:100dvh;max-height:100dvh}
.dh{position:sticky;top:0;z-index:2;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 16px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:16px}
.dh button{min-width:44px;min-height:44px;font-weight:700;color:var(--sub)}
.db{padding:16px}
.db section{margin-bottom:22px}
.db h3{margin:0 0 8px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:44px;padding:0 14px;border:1px solid #d1d5db;border-radius:10px;background:#fff;font-weight:500}
.chips button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.field{width:100%;min-height:48px;padding:0 12px;border:1px solid #d1d5db;border-radius:10px;background:#fff}
.dfoot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.dfoot .btn{width:100%}
.helpitem{display:flex;gap:12px;margin:0 0 18px}
.helpitem .ic{flex:none;width:36px;height:36px;border-radius:50%;background:#f3f4f6;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.helpitem .ic svg{width:20px;height:20px}
.helpitem h3{margin:0 0 2px;font-size:15px}.helpitem p{margin:0;color:var(--sub);font-size:14px}

#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,20px);max-width:min(440px,92vw);
  background:#111827;color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* 横幅のある画面(PC・タブレット) */
.side{display:none}
.backfix{position:fixed;top:12px;left:max(12px,calc(50% - 228px));z-index:25;color:#111}
@media (min-width:900px){
  body{background:#f3f4f6}
  #app{max-width:1120px;box-shadow:none;display:flex;flex-direction:column;padding-bottom:32px}
  #app.detail{padding-bottom:32px}
  .demo{order:-2}
  .nav{order:-1;position:sticky;top:0;left:auto;transform:none;max-width:none;width:100%;height:60px;padding:0 16px;
    justify-content:flex-start;gap:4px;border-top:0;border-bottom:1px solid var(--line)}
  .nav::before{content:"すぐ埋まる？ナビ";font-weight:700;color:var(--brand);font-size:18px;display:flex;align-items:center;margin-right:28px}
  .nav a{flex:none;flex-direction:row;gap:8px;padding:0 16px;height:100%;font-size:14px}
  .listtop{display:none}
  .seg{top:60px;padding-top:10px}
  .seg button{max-width:140px}
  .wrap{display:grid;grid-template-columns:280px 1fr;gap:16px;padding:12px 16px;align-items:start}
  .side{display:block;position:sticky;top:140px;background:#fff;border:1px solid var(--line);border-radius:14px;max-height:calc(100dvh - 160px);overflow:auto}
  .side .dh{position:static}
  .side .db{padding:14px 16px 4px}
  .content .bar{border:1px solid var(--line);border-radius:12px}
  .content .legend{margin:12px 0 0}
  .list{grid-template-columns:repeat(auto-fill,minmax(290px,1fr));padding:14px 0 0}
  .photo{height:130px}
  .cmp{margin:0 16px 12px}.h2,.note[style]{margin-left:16px!important}
  #app>.list{padding:14px 16px}
  .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;align-items:start}
  .dl,.dr{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .hero{height:300px}
  .sheet-top{margin-top:0;border-radius:0}
  .backfix{top:76px;left:max(28px,calc(50% - 530px))}
  .cta{position:static;bottom:auto;left:auto;transform:none;width:auto;max-width:none;margin:0 16px 20px;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.035)}
  dialog.full,dialog.sheet{inset:0;margin:auto;width:560px;max-width:92vw;height:auto;max-height:86dvh;border-radius:16px}
  #toast{bottom:40px}
}


/* Keeping the original reference styling and its desktop/mobile grid */
#app .nav{max-width:1120px}
#app .nav a{min-width:0}
.card{cursor:pointer}
.card .heart{z-index:2}
.card a:focus-visible{outline:3px solid #2563eb;outline-offset:-4px}
.card .price b{font-size:22px}
.card .foot .mk{flex-wrap:wrap;justify-content:flex-end}
@media(max-width:460px){.card .foot{gap:8px}.card .foot .mk{gap:3px}}
@media(min-width:900px){#app .nav{max-width:1120px}.nav::before{content:"すぐ埋まる？ナビ"}.bar{min-height:56px}}
@media(max-width:899px){.side{display:none}}
</style></head>
<body><div id="app"></div><dialog id="filterDlg" class="full" aria-labelledby="fh"></dialog><dialog id="helpDlg" class="sheet" aria-labelledby="hh"></dialog><script>
'use strict';
const app = document.getElementById('app');
const nav = document.getElementById('nav');
const threshold = 0.15;
let groups = [];
let loadState = 'loading';
let loadError = '';
const saved = new Set(JSON.parse(localStorage.getItem('riskSaved') || '[]').filter(Number.isInteger));
const state = {layout:'すべて',age:'すべて',rent:'すべて',level:'すべて',search:'',sort:'count',onlySaved:false};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function pct(n){return (n*100).toFixed(1)+'%';}
function number(n){return Number(n).toLocaleString('ja-JP');}
function optionHtml(values, selected){return values.map(x=>'<option value="'+esc(x)+'"'+(x===selected?' selected':'')+'>'+esc(x)+'</option>').join('');}
function unique(key){return ['すべて',...new Set(groups.map(x=>x[key]))];}
function filtered(){
 let a=groups.filter(g=>(state.layout==='すべて'||g.layout===state.layout)&&(state.age==='すべて'||g.age_band===state.age)&&(state.rent==='すべて'||g.rent_band===state.rent)&&(state.level==='すべて'||g.level===state.level)&&(!state.onlySaved||saved.has(g.id))&&(!state.search||label(g).toLowerCase().includes(state.search.toLowerCase())));
 return a.sort((x,y)=>state.sort==='rate'?y.day12_next7_rate-x.day12_next7_rate:state.sort==='median'?x.median_days-y.median_days:state.sort==='rent'?parseInt(x.rent_band)-parseInt(y.rent_band):y.count-x.count);
}


const ICON={"search":"<svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"10\" r=\"7\"/><path d=\"m15 15 6 6\"/></svg>","heart":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4.3 6.3a4.5 4.5 0 0 0 0 6.4L12 20.4l7.7-7.7a4.5 4.5 0 0 0-6.4-6.4L12 7.6l-1.3-1.3a4.5 4.5 0 0 0-6.4 0z\"/></svg>","up":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 15l7-7 7 7\"/></svg>","down":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m19 9-7 7-7-7\"/></svg>"};
function badge(g){return g.level==='hi'?'<span class="badge hi">'+ICON.up+'終わりやすい</span>':'<span class="badge lo">'+ICON.down+'終わりにくい</span>';}
function label(g){return g.layout+' / 築'+g.age_band+' / '+g.rent_band+'万円';}
function navRender(active){return '<nav class="nav" aria-label="メイン"><a href="#/" '+(active==='list'?'aria-current="page"':'')+'>'+ICON.search+'物件を検索</a><a href="#/saved" '+(active==='saved'?'aria-current="page"':'')+'>'+ICON.heart+'<span>お気に入り'+(saved.size?'<i>'+saved.size+'</i>':'')+'</span></a></nav>';}
function gradient(g){const hues=[20,345,330,288,190,245,36,160];const h=hues[g.id%hues.length];return 'linear-gradient(135deg,hsl('+h+' 34% 63%),hsl('+((h+40)%360)+' 42% 48%))';}
function moneyBand(g){return esc(g.rent_band);}
function card(g){
  return '<article class="card">'+
  '<a href="#/group/'+g.id+'" aria-label="'+esc(label(g))+' の詳細を見る">'+
  '<div class="photo" style="background:'+gradient(g)+'" aria-hidden="true">'+esc(g.layout)+'</div>'+
  '<div class="body"><div class="price"><b>'+moneyBand(g)+'<small>万円</small></b><span>家賃帯</span></div>'+
  '<div class="tags"><span>'+esc(g.layout)+'</span><span>築'+esc(g.age_band)+'</span><span>'+moneyBand(g)+'万円</span></div>'+
  '<div class="sta">国分寺市周辺</div>'+
  '<div class="foot"><span class="d">掲載12日目を基準</span><span class="mk"><span class="cap">1週間以内に</span>'+badge(g)+'</span></div>'+
  '</div></a><button class="heart" data-save="'+g.id+'" aria-pressed="'+saved.has(g.id)+'" aria-label="'+(saved.has(g.id)?'お気に入りから外す':'お気に入りに追加')+'">'+ICON.heart+'</button></article>';
}
function chipGroup(key){
 return '<div class="chips" role="group" aria-label="間取り">'+unique('layout').filter(x=>x!=='すべて').map(x=>'<button type="button" data-layout="'+esc(x)+'" aria-pressed="'+(state.layout===x)+'">'+esc(x)+'</button>').join('')+'</div>';
}
function filterFields(){
 return '<section><h3>間取り</h3>'+chipGroup('layout')+'</section>'+
 '<section><h3>家賃帯</h3><select class="field" id="filterRent" aria-label="家賃の上限">'+optionHtml(unique('rent_band'),state.rent)+'</select></section>'+
 '<section><h3>築年数</h3><select class="field" id="filterAge" aria-label="築年数">'+optionHtml(unique('age_band'),state.age)+'</select></section>'+
 '<section><h3>キーワード</h3><input class="field" id="filterSearch" placeholder="例：1K / 6〜8" value="'+esc(state.search)+'"></section>'+
 '<section><label><input type="checkbox" id="onlySaved" '+(state.onlySaved?'checked':'')+'> お気に入りだけ</label></section>';
}
function renderFilter(){
 const d=document.getElementById('filterDlg');
 d.innerHTML='<div class="dh"><button data-clear>クリア</button><h2 id="fh">条件を変更</h2><button data-close="filterDlg" aria-label="閉じる">✕</button></div>'+
 '<div class="db">'+filterFields()+'</div><div class="dfoot"><button class="btn" data-close="filterDlg">この条件で見る</button></div>';
}
function renderHelp(){
 const d=document.getElementById('helpDlg');
 d.innerHTML='<div class="dh"><h2 id="hh">終わりやすさの目安について</h2><button data-close="helpDlg" aria-label="閉じる">✕</button></div>'+
 '<div class="db"><p style="margin:0 0 16px;font-weight:700">お部屋探しで、問い合わせの順番を考えるための参考情報です。</p>'+
 '<div class="helpitem"><div class="ic">'+ICON.up+'</div><div><h3>「終わりやすい」と「終わりにくい」とは</h3><p>同じ条件の過去の掲載終了割合から、7日以内に終わる割合が15%以上なら「終わりやすい」、未満なら「終わりにくい」としています。</p></div></div>'+
 '<div class="helpitem"><div class="ic">'+ICON.down+'</div><div><h3>掲載の終了は、成約とは限りません</h3><p>掲載が終わっても、誰かが契約したとは限りません。</p></div></div>'+
 '</div><div class="dfoot"><button class="btn" data-close="helpDlg">閉じる</button></div>';
}
function renderList(){
 const items=filtered();
 const oldLevel=state.level;
 state.level='すべて';const all=filtered();state.level=oldLevel;
 const counts={all:all.length,hi:all.filter(g=>g.level==='hi').length,lo:all.filter(g=>g.level==='lo').length};
 const seg=(k,l)=>'<button data-level="'+(k==='all'?'すべて':k)+'" aria-pressed="'+(state.level===(k==='all'?'すべて':k))+'">'+l+'<small>'+counts[k]+'</small></button>';
 return '<header class="top listtop"><button class="search" data-open="filter" aria-label="検索条件を変更する">'+ICON.search+'<span class="t"><b>国分寺市周辺</b><span>条件を選んで物件をさがす</span></span></button></header>'+
 '<div class="seg" role="group" aria-label="終わりやすさで絞り込む">'+seg('all','すべて')+seg('hi','終わりやすい')+seg('lo','終わりにくい')+'</div>'+
 '<div class="wrap"><aside class="side" aria-label="絞り込み"><div class="dh"><h2>条件</h2><button data-clear>クリア</button></div><div class="db">'+filterFields()+'</div></aside>'+
 '<div class="content"><div class="bar"><div class="n" aria-live="polite"><em>'+items.length+'</em> 件</div>'+
 '<label><span class="sr">並び替え</span><select class="sort" data-sort>'+
 [['count','データが多い順'],['rate','終わりやすい順'],['median','掲載終了までが早い順'],['rent','家賃が安い順']].map(x=>'<option value="'+x[0]+'" '+(state.sort===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+
 '</select></label></div>'+
 '<div class="legend"><b>1週間以内に掲載が終わりやすいかの目安です。</b>掲載が終わっても、成約したとは限りません。 <button data-open="help">くわしく</button></div>'+
 (loadState==='loading'?'<div class="empty">読み込み中です。</div>':loadState==='error'?'<div class="empty">読み込みに失敗しました。<button class="btn" id="retry">再試行</button></div>':items.length?'<div class="list">'+items.map(card).join('')+'</div>':'<div class="empty"><p>条件に合う物件がありません。</p><button data-reset>条件をゆるめる</button></div>')+
 '</div></div>'+navRender('list');
}
function home(){app.className='';app.innerHTML=renderList();}
function savedPage(){
 const items=groups.filter(g=>saved.has(g.id)).sort((a,b)=>state.sort==='rate'?b.day12_next7_rate-a.day12_next7_rate:state.sort==='median'?a.median_days-b.median_days:state.sort==='rent'?parseInt(a.rent_band)-parseInt(b.rent_band):b.count-a.count);
 const rows=items.map(g=>'<tr><td><a href="#/group/'+g.id+'"><b>'+esc(g.layout)+'</b> '+moneyBand(g)+'万円<br><small>築'+esc(g.age_band)+'</small></a></td><td>'+badge(g)+'</td><td>12日目を基準</td><td>約'+g.median_days+'日</td></tr>').join('');
 app.className='';
 app.innerHTML='<header class="top"><div style="padding:14px 16px 10px"><b style="font-size:16px">お気に入りの物件</b></div></header>'+
 (items.length?'<div class="bar"><div class="n"><em>'+items.length+'</em> 件</div></div><h2 class="h2">並べて比べる</h2><div class="cmp"><table><thead><tr><th>物件</th><th>目安</th><th>掲載から</th><th>同条件の過去<br>(半分が終了)</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="list">'+items.map(card).join('')+'</div>':
 '<div class="empty"><p>お気に入りの物件はまだありません。<br>気になる物件のハートを押すと、ここで並べて比べられます。</p><a class="btn" style="display:inline-flex;align-items:center" href="#/">物件をさがす</a></div>')+navRender('saved');
}
function detail(id){
 const g=groups.find(x=>x.id===id);
 if(!g){if(loadState==='loading'){app.innerHTML='<div class="empty">読み込み中です。</div>';return;}location.hash='#/';return;}
 const max=Math.max(g.three_quarter_days,60);
 const row=(txt,d)=>'<div class="r"><span>'+txt+'</span><div class="bar2" role="img" aria-label="'+txt+'は約'+d+'日までに終了" style="--w:'+(d/max)+'"><i></i><b>約'+d+'日までに終了</b></div></div>';
 app.className='detail';
 app.innerHTML='<div class="dgrid"><div class="dl"><div class="hero" style="background:'+gradient(g)+'" aria-hidden="true">'+esc(g.layout)+'</div>'+
 '<button class="back backfix" data-back aria-label="一覧へ戻る">'+ICON.down+'</button>'+
 '<div class="sheet-top"><h1>'+moneyBand(g)+'<small>万円（家賃帯）</small></h1>'+
 '<p class="sub">同条件の掲載傾向 / 掲載12日目を基準</p>'+
 '<dl class="spec"><dt>間取り</dt><dd>'+esc(g.layout)+'</dd><dt>築年数</dt><dd>築'+esc(g.age_band)+'</dd><dt>家賃</dt><dd>'+moneyBand(g)+'万円</dd><dt>対象地域</dt><dd>国分寺市</dd></dl></div></div>'+
 '<div class="dr"><div class="panel"><h2>終わりやすさの目安<button class="info" data-open="help" aria-label="目安についての説明を見る">ⓘ</button></h2>'+
 '<div class="mark '+(g.level==='lo'?'lo':'')+'"><div class="row">'+badge(g)+'<span class="t">1週間以内に掲載が'+(g.level==='hi'?'終わりやすい':'終わりにくい')+'条件です。</span></div>'+
 '<p class="note">掲載が終わっても、成約したとは限りません。</p>'+
 '<details class="more"><summary>くわしく見る</summary><p>掲載12日目まで続いていた同じ条件の物件が、その後7日以内に掲載終了した割合は '+pct(g.day12_next7_rate)+' です。</p>'+
 '<p>15%以上を「終わりやすい」、未満を「終わりにくい」と表示しています。</p></details></div>'+
 '<div class="rec"><h3>同じ条件の過去の実績</h3><p class="key">半分の物件が、'+(g.median_days<1?'掲載当日':'約'+g.median_days+'日')+'までに終わりました。</p>'+
 '<details class="more"><summary>グラフと説明を見る</summary><p class="cond">'+esc(label(g))+'</p>'+
 '<p class="lead">国分寺市で2020〜2023年に掲載された、同じ条件の物件 '+number(g.count)+'件を、掲載を始めた日から数えた日数です。</p>'+
 row('半分の物件',g.median_days)+row('4分の3の物件',g.three_quarter_days)+
 '<p class="note">この日数は過去の掲載実績です。この条件に当てはまる現在の物件が成約するかどうかを予測するものではありません。</p></details></div></div></div></div>'+
 '<div class="cta"><button class="heart" data-save="'+g.id+'" aria-pressed="'+saved.has(g.id)+'" aria-label="'+(saved.has(g.id)?'お気に入りから外す':'お気に入りに追加')+'">'+ICON.heart+'</button>'+
 '<a class="btn" href="#/saved">お気に入りを見る</a></div>';
}
function render(){
 const h=location.hash||'#/';
 window.scrollTo(0,0);
 if(h==='#/'||h==='#'||h==='#/groups'){home();document.title='すぐ埋まる？ナビ - 物件を検索';}
 else if(h==='#/saved'){savedPage();document.title='お気に入り - すぐ埋まる？ナビ';}
 else if(/^#\/group\/\d+$/.test(h)){detail(Number(h.split('/').pop()));document.title='物件の詳細 - すぐ埋まる？ナビ';}
 else{location.hash='#/';}
}
document.addEventListener('click',function(event){
 const save=event.target.closest('[data-save]');
 if(save){const id=Number(save.dataset.save);saved.has(id)?saved.delete(id):saved.add(id);localStorage.setItem('riskSaved',JSON.stringify([...saved]));render();return;}
 const level=event.target.closest('[data-level]');
 if(level){state.level=level.dataset.level;render();return;}
 const layout=event.target.closest('[data-layout]');
 if(layout){state.layout=state.layout===layout.dataset.layout?'すべて':layout.dataset.layout;render();if(document.getElementById('filterDlg').open)renderFilter();return;}
 const opener=event.target.closest('[data-open]');
 if(opener){if(opener.dataset.open==='filter'){renderFilter();document.getElementById('filterDlg').showModal();}if(opener.dataset.open==='help'){renderHelp();document.getElementById('helpDlg').showModal();}return;}
 const closer=event.target.closest('[data-close]');
 if(closer){document.getElementById(closer.dataset.close).close();return;}
 if(event.target.closest('[data-back]')){location.hash='#/';return;}
 if(event.target.closest('[data-clear],[data-reset]')){Object.assign(state,{layout:'すべて',age:'すべて',rent:'すべて',level:'すべて',search:'',sort:'count',onlySaved:false});render();if(document.getElementById('filterDlg').open)renderFilter();return;}
 if(event.target.closest('#retry')){loadGroups();return;}
});
document.addEventListener('change',function(event){
 const id=event.target.id;
 if(id==='filterAge'){state.age=event.target.value;render();}
 if(id==='filterRent'){state.rent=event.target.value;render();}
 if(id==='onlySaved'){state.onlySaved=event.target.checked;render();}
 if(event.target.matches('[data-sort]')){state.sort=event.target.value;render();}
});
document.addEventListener('input',function(event){if(event.target.id==='filterSearch'){state.search=event.target.value;render();}});
window.addEventListener('hashchange',render);

async function loadGroups(){
 loadState='loading';loadError='';render();
 try{
  const response=await fetch('/api/groups');
  if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json();
  if(!Array.isArray(data.groups))throw new Error('集計データの形式が不正');
  groups=data.groups;loadState='ok';
 }catch(err){loadState='error';loadError=err.message;}
 render();
}
render();
loadGroups();
</script></body>
</html>
