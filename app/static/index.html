<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>すぐ埋まる？ナビ</title>
<style>
:root{
  --brand:#8B1E3F; --brand-soft:#fdf2f5; --brand-line:#f1c5d2;
  --ink:#1f2937; --sub:#4b5563; --mute:#6b7280; --line:#e5e7eb;
  --bg:#f3f4f6; --card:#fff; --nav-h:64px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#e5e7eb;color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  font-size:14px;line-height:1.6}
button,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;
  box-shadow:0 0 30px rgba(0,0,0,.12);padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
#app.detail{padding-bottom:calc(84px + env(safe-area-inset-bottom))}

/* デモ表示 */
.demo{background:#fff7ed;border-bottom:1px solid #fed7aa;color:#9a3412;font-size:12px;
  padding:8px 12px;display:flex;gap:8px;align-items:flex-start}
.demo button{margin-left:auto;min-width:44px;min-height:32px;color:#9a3412;font-weight:700}

/* ヘッダー */
.top{background:#fff;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:10px;width:calc(100% - 24px);margin:10px 12px 10px;
  min-height:52px;padding:8px 14px;background:#f9fafb;border:1px solid var(--line);border-radius:999px;text-align:left}
.search .t{flex:1;min-width:0}
.search .t b{display:block;font-size:14px}
.search .t span{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:6px;padding:6px 12px 10px}
.seg button{flex:1;min-height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;
  font-weight:700;font-size:13px;color:var(--sub)}
.seg button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.seg small{font-weight:500;font-size:12px;margin-left:2px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line)}
.bar .n{font-weight:700}
.bar .n em{font-style:normal;color:var(--brand);font-size:18px}
.sort{min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13px}

/* 凡例 */
.legend{margin:10px 12px 0;padding:8px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:12px;color:var(--sub)}
.legend b{color:var(--ink)}
.legend button{color:var(--brand);font-weight:700;text-decoration:underline;min-height:32px}

/* 物件カード */
.list{padding:12px;display:grid;gap:14px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card a{display:block}
.card a:active{background:#fafafa}
.photo{height:150px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;
  color:rgba(255,255,255,.92);letter-spacing:.05em}
.card .body{padding:12px 14px 14px}
.price{display:flex;align-items:baseline;justify-content:space-between}
.price b{font-size:22px}.price b small{font-size:13px;font-weight:500}
.price span{font-size:12px;color:var(--mute)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tags span{background:#f3f4f6;color:var(--sub);padding:2px 8px;border-radius:6px;font-size:12px}
.sta{font-size:13px;color:var(--sub)}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid #f3f4f6}
.foot .d{font-size:12px;color:var(--mute)}
.foot .mk{display:flex;align-items:center;gap:6px}
.foot .cap{font-size:12px;color:var(--sub)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;font-weight:700;font-size:13px;border:1px solid}
.badge svg{width:14px;height:14px}
.badge.hi{background:var(--brand-soft);color:var(--brand);border-color:var(--brand-line)}
.badge.lo{background:#f3f4f6;color:#374151;border-color:#d1d5db}
.heart{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);
  display:flex;align-items:center;justify-content:center;color:#6b7280;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.heart svg{width:22px;height:22px}
.heart[aria-pressed=true]{color:var(--brand)}
.heart[aria-pressed=true] svg{fill:currentColor}

.empty{margin:40px 20px;text-align:center;color:var(--sub)}
.empty button,.btn{min-height:48px;padding:0 20px;border-radius:12px;background:var(--brand);color:#fff;font-weight:700}
.empty p{margin:0 0 14px}

/* 下のナビ */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:flex;z-index:30}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--mute);font-weight:500}
.nav a[aria-current=page]{color:var(--brand);font-weight:700}
.nav svg{width:24px;height:24px}
.nav i{font-style:normal;background:var(--brand);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;margin-left:4px}

/* 詳細 */
.hero{height:230px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;color:rgba(255,255,255,.92);position:relative}
.back{position:absolute;top:12px;left:12px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.back svg{width:22px;height:22px}
.sheet-top{background:#fff;margin-top:-20px;border-radius:20px 20px 0 0;position:relative;padding:18px 16px 4px}
.sheet-top h1{margin:0;font-size:30px;line-height:1.1}.sheet-top h1 small{font-size:16px;font-weight:500}
.sheet-top .sub{margin:6px 0 0;font-size:13px;color:var(--mute)}
dl.spec{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:16px 0;font-size:14px}
dl.spec dt{color:var(--mute)}dl.spec dd{margin:0}
.panel{background:#fff;padding:4px 16px 20px}
.panel h2{display:flex;align-items:center;justify-content:space-between;font-size:16px;margin:12px 0}
.info{min-width:44px;min-height:44px;color:var(--mute);display:flex;align-items:center;justify-content:center}
.info svg{width:22px;height:22px}
.mark{border:1px solid var(--brand-line);background:var(--brand-soft);border-radius:14px;padding:14px}
.mark.lo{border-color:var(--line);background:#f9fafb}
.mark .row{display:flex;align-items:center;gap:10px}
.mark .row span.t{font-size:14px}
.rec{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.rec h3{margin:0 0 8px;font-size:13px;color:var(--sub)}
.rec .r{margin:10px 0;font-size:13px}
.rec .r>span{display:block;color:var(--sub);margin-bottom:2px}
.more{margin-top:4px}
.more summary{min-height:44px;display:flex;align-items:center;gap:6px;color:var(--brand);font-weight:700;font-size:13px;cursor:pointer;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:"▼";font-size:9px}
.more[open] summary::after{content:"▲"}
.more p{margin:6px 0;font-size:13px;color:var(--sub)}
.more .cond{font-weight:700;color:var(--ink)}
.more .lead{margin:6px 0 4px}
.rec .key{margin:6px 0 0;font-size:15px;font-weight:700;color:var(--ink)}
.mark .note{margin:8px 0 0}
.rec .lead{margin:0 0 8px;font-size:13px;color:var(--sub)}
.rec .bar2{display:flex;align-items:center;gap:8px;min-height:22px}
.rec .bar2 i{flex:none;display:block;height:16px;border-radius:4px;background:var(--brand);width:max(4px,calc((100% - 9.5em) * var(--w)))}
.rec .bar2 b{font-size:12px;white-space:nowrap}
.rec .n{font-size:12px;color:var(--mute);margin:6px 0 0}
.note{font-size:12px;color:var(--mute);margin:10px 0 0}
.cta{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:30}
.cta .heart{position:static;box-shadow:none;border:1px solid var(--line);border-radius:12px;width:56px;height:52px;background:#fff}
.cta .btn{flex:1;min-height:52px;font-size:16px}

/* キープ比較 */
.cmp{margin:0 12px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#f9fafb;color:var(--sub);font-weight:700;font-size:12px}
tr:last-child td{border-bottom:0}
.h2{margin:14px 12px 0;font-size:15px}

/* ダイアログ */
dialog{border:0;padding:0;color:var(--ink);background:#fff}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;width:100%;max-width:480px;max-height:88dvh;border-radius:20px 20px 0 0;overflow:auto}
dialog.full{position:fixed;inset:0;margin:0 auto;width:100%;max-width:480px;height:100dvh;max-height:100dvh}
.dh{position:sticky;top:0;z-index:2;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 16px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:16px}
.dh button{min-width:44px;min-height:44px;font-weight:700;color:var(--sub)}
.db{padding:16px}
.db section{margin-bottom:22px}
.db h3{margin:0 0 8px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:44px;padding:0 14px;border:1px solid #d1d5db;border-radius:10px;background:#fff;font-weight:500}
.chips button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.field{width:100%;min-height:48px;padding:0 12px;border:1px solid #d1d5db;border-radius:10px;background:#fff}
.dfoot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.dfoot .btn{width:100%}
.helpitem{display:flex;gap:12px;margin:0 0 18px}
.helpitem .ic{flex:none;width:36px;height:36px;border-radius:50%;background:#f3f4f6;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.helpitem .ic svg{width:20px;height:20px}
.helpitem h3{margin:0 0 2px;font-size:15px}.helpitem p{margin:0;color:var(--sub);font-size:14px}

#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,20px);max-width:min(440px,92vw);
  background:#111827;color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* 横幅のある画面(PC・タブレット) */
.side{display:none}
.backfix{position:fixed;top:12px;left:max(12px,calc(50% - 228px));z-index:25;color:#111}
@media (min-width:900px){
  body{background:#f3f4f6}
  #app{max-width:1120px;box-shadow:none;display:flex;flex-direction:column;padding-bottom:32px}
  #app.detail{padding-bottom:32px}
  .demo{order:-2}
  .nav{order:-1;position:sticky;top:0;left:auto;transform:none;max-width:none;width:100%;height:60px;padding:0 16px;
    justify-content:flex-start;gap:4px;border-top:0;border-bottom:1px solid var(--line)}
  .nav::before{content:"すぐ埋まる？ナビ";font-weight:700;color:var(--brand);font-size:18px;display:flex;align-items:center;margin-right:28px}
  .nav a{flex:none;flex-direction:row;gap:8px;padding:0 16px;height:100%;font-size:14px}
  .listtop{display:none}
  .seg{top:60px;padding-top:10px}
  .seg button{max-width:140px}
  .wrap{display:grid;grid-template-columns:280px 1fr;gap:16px;padding:12px 16px;align-items:start}
  .side{display:block;position:sticky;top:140px;background:#fff;border:1px solid var(--line);border-radius:14px;max-height:calc(100dvh - 160px);overflow:auto}
  .side .dh{position:static}
  .side .db{padding:14px 16px 4px}
  .content .bar{border:1px solid var(--line);border-radius:12px}
  .content .legend{margin:12px 0 0}
  .list{grid-template-columns:repeat(auto-fill,minmax(290px,1fr));padding:14px 0 0}
  .photo{height:130px}
  .cmp{margin:0 16px 12px}.h2,.note[style]{margin-left:16px!important}
  #app>.list{padding:14px 16px}
  .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;align-items:start}
  .dl,.dr{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .hero{height:300px}
  .sheet-top{margin-top:0;border-radius:0}
  .backfix{top:76px;left:max(28px,calc(50% - 530px))}
  .cta{position:sticky;left:auto;transform:none;max-width:none;width:auto;margin:0 16px;border:1px solid var(--line);border-radius:14px;bottom:12px}
  dialog.full,dialog.sheet{inset:0;margin:auto;width:560px;max-width:92vw;height:auto;max-height:86dvh;border-radius:16px}
  #toast{bottom:40px}
}
</style>
</head>

<script>

/* ===== 小道具 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

};
const badge = lv => lv==='hi'
  ? `<span class="badge hi">${ICON.up}掲載終了リスク：高</span>`
  : lv==='lo' ? `<span class="badge lo">${ICON.down}掲載終了リスク：低</span>`
  : `<span class="badge lo">集計対象外</span>`;
const photo = p => `<div class="photo" style="background:linear-gradient(135deg,hsl(${p.hue} 35% 62%),hsl(${(p.hue+40)%360} 40% 48%))" aria-hidden="true">${esc(p.layout)}</div>`;
const money = p => p.rent.toFixed(1).replace(/\.0$/,'');

function ageBand(a){return a<10?'10年未満':a<20?'10〜20年':a<30?'20〜30年':a<40?'30〜40年':'40年以上'}
function statsOf(p){const low=Math.floor(p.rent/2)*2; return {s:STATS[`${p.layout}|${ageBand(p.age)}|${low}`]||null, cond:`${p.layout}・${ageBand(p.age)}・家賃${low}〜${low+2}万円`}}
const dayText = d => d<1 ? '掲載当日' : `約${d}日`;
const walkMin = p => Math.min(...p.st.map(x=>x[1]));

/* ===== 状態 ===== */
const store = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
               set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const state = {
  f:{layouts:new Set(), stations:new Set(), rentMax:0, ageMax:0, walkMax:0},
  level:'all', sort:'new',
  keep:new Set(store.get('keep',[])),
  demoOpen:store.get('demoOpen',true),
  listScroll:0, inApp:false,
};
const SORTS = {
  new:['新着順',(a,b)=>a.days-b.days],
  rent:['家賃が安い順',(a,b)=>a.rent-b.rent],
  age:['築年数が浅い順',(a,b)=>a.age-b.age],
  walk:['駅が近い順',(a,b)=>walkMin(a)-walkMin(b)],
  hi:['終わりやすい順',(a,b)=>(a.level==='hi'?0:1)-(b.level==='hi'?0:1)||a.days-b.days],
};

function passFilter(p, ignoreLevel){
  const f=state.f;
  if(f.layouts.size && !f.layouts.has(p.layout)) return false;
  if(f.rentMax && p.rent>f.rentMax) return false;
  if(f.ageMax && p.age>f.ageMax) return false;
  const sts = f.stations.size ? p.st.filter(x=>f.stations.has(x[0])) : p.st;
  if(!sts.length) return false;
  if(f.walkMax && !sts.some(x=>x[1]<=f.walkMax)) return false;
  if(!ignoreLevel && state.level!=='all' && p.level!==state.level) return false;
  return true;
}
const visible = () => LISTINGS.filter(p=>passFilter(p)).sort(SORTS[state.sort][1]);

function summary(){
  const f=state.f, t=[];
  if(f.stations.size) t.push([...f.stations].join('・'));
  if(f.layouts.size) t.push([...f.layouts].join('・'));
  if(f.rentMax) t.push(`${f.rentMax}万円以下`);
  if(f.ageMax) t.push(`築${f.ageMax}年以内`);
  if(f.walkMax) t.push(`徒歩${f.walkMax}分以内`);
  return t.length? t.join(' / ') : '条件なし(国分寺市周辺)';
}

async function loadHistorical(id){
  const p=LISTINGS.find(x=>x.id===id), output=document.getElementById('historical-api');
  if(!p || !output)return;
  try {
    const q=new URLSearchParams({layout:p.layout,age:String(p.age),rent_man:String(p.rent)});
    const response=await fetch('/api/historical?'+q);
    if(!response.ok)throw new Error('APIエラー '+response.status);
    const d=await response.json();
    if(!output.isConnected)return;
    if(!d.found){output.textContent='この条件の集計はありません。';return;}
    const pct=(d.risk_after_12_days*100).toFixed(1);
    output.innerHTML='<strong style="font-size:22px;color:var(--brand)">'+pct+'%</strong>'
      +'<p>同条件の過去 '+Number(d.sample_size).toLocaleString()+'件をもとに、掲載12日目から次の7日以内の掲載終了割合を推定した値です。</p>'
      +'<p>これは過去の実績であり、この物件固有の予測ではありません。現在の掲載日数と混同しないでください。</p>';
  }catch(e){if(output.isConnected)output.textContent='集計APIに接続できませんでした。サーバーから起動してください。';}
}

async function loadRiskLabels() {
  const modelInput={properties:LISTINGS.map(p=>({
    id:p.id, layout:p.layout, age:p.age, rent:p.rent*10000,
    area:p.area, walk_distance:p.st[0][1], station:p.st[0][0],
    start_month:6, city:'国分寺市', elapsed_day:p.days
  }))};
  let endpoint='/api/predict', data=modelInput;
  let mode='model';
  try {
    let res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    if(res.status===503) {
      mode='historical';
      endpoint='/api/historical-risks';
      data={properties:LISTINGS.map(p=>({id:p.id,layout:p.layout,age:p.age,rent_man:p.rent}))};
      res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    }
    if(!res.ok)throw new Error('HTTP '+res.status);
    const body=await res.json(), byId=new Map(body.results.map(x=>[x.id,x]));
    for(const p of LISTINGS){
      const result=byId.get(p.id);
      p.level=result?.level||'unknown';
      p.historicalRisk=mode==='historical' ? (result?.risk??null) : null;
      p.modelRisk=mode==='model' ? (result?.risk??null) : null;
    }
    window.riskMode=mode;
    rerender();
  }catch(e){
    console.error('掲載終了リスク取得に失敗:',e);
    toast('掲載終了リスクを取得できません。サーバーを確認してください。');
  }
}

/* ===== ルーティング ===== */
function route(){
  const h = location.hash || '#/';
  const app = $('#app');
  const m = h.match(/^#\/p\/(\d+)$/);
  const prevDetail = app.classList.contains('detail');
  if(!prevDetail) state.listScroll = window.scrollY;
  if(m){ app.className='detail'; app.innerHTML = renderDetail(+m[1]); loadHistorical(+m[1]); window.scrollTo(0,0); document.title='物件の詳細 - すぐ埋まる？ナビ'; return; }
  app.className='';
  if(h==='#/keep'){ app.innerHTML=renderKeep(); document.title='キープ - すぐ埋まる？ナビ'; }
  else if(h==='#/my'){ app.innerHTML=renderMy(); document.title='マイページ - すぐ埋まる？ナビ'; }
  else { app.innerHTML=renderList(); document.title='すぐ埋まる？ナビ - 画面イメージ'; }
  window.scrollTo(0, prevDetail ? state.listScroll : 0);
}
const rerender = () => { const y=window.scrollY; route(); window.scrollTo(0,y); };
window.addEventListener('hashchange', ()=>{ state.inApp=true; route(); });

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
function toggleKeep(id){
  state.keep.has(id)?state.keep.delete(id):state.keep.add(id);
  store.set('keep',[...state.keep]);
  toast(state.keep.has(id)?'キープしました':'キープから外しました');
  rerender();
}

/* ===== イベント ===== */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-keep],[data-level],[data-open],[data-close],[data-back],[data-demo],[data-reset],[data-clear],[data-chip]');
  if(e.target.tagName==='DIALOG'){ e.target.close(); return; }
  if(!t) return;
  if(t.dataset.keep){ e.preventDefault(); toggleKeep(+t.dataset.keep); }
  else if(t.dataset.level){ state.level=t.dataset.level; rerender(); }
  else if(t.dataset.open==='filter'){ renderFilter(); $('#filterDlg').showModal(); }
  else if(t.dataset.open==='help'){ renderHelp(); $('#helpDlg').showModal(); }
  else if(t.dataset.close){ $('#'+t.dataset.close).close(); }
  else if('back' in t.dataset){ state.inApp ? history.back() : (location.hash='#/'); }
  else if(t.dataset.demo){ state.demoOpen=false; store.set('demoOpen',false); rerender(); }
  else if('reset' in t.dataset){ state.f={layouts:new Set(),stations:new Set(),rentMax:0,ageMax:0,walkMax:0}; state.level='all'; rerender(); }
  else if('clear' in t.dataset){ state.f={layouts:new Set(),stations:new Set(),rentMax:0,ageMax:0,walkMax:0}; renderFilter(); rerender(); }
  else if(t.dataset.chip){ const s=state.f[t.dataset.chip], v=t.dataset.v; s.has(v)?s.delete(v):s.add(v); const inSide=!!t.closest('.side'); renderFilter(); rerender();
    const q=`${inSide?'.side ':'#filterDlg '}[data-chip="${t.dataset.chip}"][data-v="${v}"]`; document.querySelector(q)?.focus(); }
});
document.addEventListener('change', e=>{
  if(e.target.matches('[data-sort]')){ state.sort=e.target.value; rerender(); }
  else if(e.target.matches('[data-sel]')){ const k=e.target.dataset.sel, inSide=!!e.target.closest('.side'); state.f[k]=+e.target.value; renderFilter(); rerender();
    document.querySelector(`${inSide?'.side ':'#filterDlg '}[data-sel="${k}"]`)?.focus(); }
});
route();
loadRiskLabels();
</script>
</body>
</html>
