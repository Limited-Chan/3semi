<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>すぐ埋まる？ナビ｜掲載が終わりやすい？終わりにくい？</title>
<style>
:root{--wine:#8b1e3f;--wine-dark:#68142c;--pink:#fff1f4;--line:#e5e7eb;--muted:#617084;--text:#263040;--bg:#f6f7f9;--white:#fff;--shadow:0 8px 25px rgba(34,20,29,.055)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--text);background:var(--bg);font:15px/1.65 "Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #437ad0;outline-offset:3px}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.header-inner{max-width:1130px;margin:auto;min-height:74px;display:flex;align-items:center;gap:16px;padding:12px 20px}
.logo{color:var(--wine);font-size:21px;font-weight:900;letter-spacing:-.05em;white-space:nowrap}
.logo small{display:block;color:#85818a;letter-spacing:0;font-size:10px;font-weight:500;margin-top:-3px}
nav{display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:wrap}
nav a{padding:8px 12px;border-radius:10px;font-size:13px;font-weight:700;color:#596271}
nav a.active{background:var(--pink);color:var(--wine)}
main{max-width:1130px;margin:0 auto;padding:28px 20px 84px;min-height:calc(100vh - 75px)}
.hero{background:linear-gradient(125deg,var(--wine),#ac4968);border-radius:22px;color:#fff;padding:28px 32px;display:flex;gap:28px;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
.hero h1{margin:0 0 8px;line-height:1.45;font-size:clamp(23px,3vw,32px);letter-spacing:-.04em}
.hero p{margin:0;color:#ffeaf0;max-width:590px}.hero .bubble{border:1px solid #ffffff55;padding:14px 18px;border-radius:16px;background:#ffffff1c;min-width:190px}
.bubble strong{display:block;font-size:30px;line-height:1.3}.bubble small{font-size:12px;color:#ffe8ee}
.notice{padding:12px 15px;margin:17px 0;background:#fff;border:1px solid #efd3dc;border-left:4px solid var(--wine);border-radius:10px;font-size:13px;color:#59535a}
.notice strong{color:var(--wine)}.layout{display:grid;grid-template-columns:258px minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
.panel,.tile,.detail-card,.compare-box{background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.panel{padding:20px;position:sticky;top:94px}.panel h2{font-size:17px;margin:0 0 13px}
.field{display:block;margin:12px 0}.field label{display:block;font-size:12px;font-weight:700;color:#525a67;margin-bottom:5px}
select,input{background:#fff;width:100%;border:1px solid #d6dae1;border-radius:10px;min-height:42px;padding:8px 11px;color:var(--text)}
input[type=checkbox]{width:auto;min-height:auto;accent-color:var(--wine)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.chip{padding:7px 12px;border:1px solid #d4dae0;background:white;border-radius:999px;font-size:12px;font-weight:700;color:#555e6e}
.chip.active{color:var(--wine);border-color:var(--wine);background:var(--pink)}
.reset{background:transparent;color:var(--wine);font-weight:700;border:0;text-decoration:underline}
.section-head{display:flex;align-items:end;gap:12px;justify-content:space-between;flex-wrap:wrap;margin:0 0 13px}
.section-head h2{margin:0;font-size:20px}.small{color:var(--muted);font-size:12px}.count{font-size:13px;color:var(--muted)}
.count b{color:var(--wine);font-size:23px}.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.tile{padding:18px;display:flex;flex-direction:column;min-width:0;transition:transform .12s,border-color .12s}
.tile:hover{border-color:#d6a4b5;transform:translateY(-1px)}
.tile-top{display:flex;align-items:start;justify-content:space-between;gap:8px}
.tile h3{font-size:19px;margin:0;line-height:1.5}.price{font-weight:700;color:var(--wine);font-size:17px;margin-top:4px}
.tag{font-size:11px;font-weight:800;border-radius:8px;padding:5px 9px;white-space:nowrap}
.tag.high{color:var(--wine);background:#fce7ee;border:1px solid #f1c7d3}.tag.low{color:#475569;background:#f0f2f5;border:1px solid #dee2e8}
.data-number{font-size:32px;color:var(--wine);font-weight:900;font-variant-numeric:tabular-nums;line-height:1.3;margin:17px 0 0}
.data-number small{font-size:13px;font-weight:600;color:var(--muted);margin-left:5px}
.meter{height:7px;background:#f1e6eb;border-radius:10px;overflow:hidden;margin:8px 0 12px}
.meter i{height:100%;display:block;background:var(--wine);border-radius:10px}
.meta{font-size:12px;color:#626a77;display:grid;gap:3px}.meta strong{color:#273244}
.tile-buttons{display:flex;gap:8px;margin-top:auto;padding-top:16px}.btn{border:0;border-radius:10px;background:var(--wine);color:#fff;font-weight:800;min-height:44px;padding:9px 16px;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn:hover{background:var(--wine-dark)}.btn.alt{background:#fff;color:var(--wine);border:1px solid #dcaebe}.btn.alt:hover{background:var(--pink)}
.tile-buttons .btn:first-child{flex:1}.tile-buttons .save{width:44px;flex:none;font-size:20px}
.empty{background:#fff;border:1px dashed #c9ced6;border-radius:16px;text-align:center;padding:42px 18px;color:var(--muted)}
.intro{max-width:760px;margin:0 auto 22px}.intro h1{margin:0 0 7px;font-size:clamp(24px,3vw,30px);line-height:1.4}.intro p{margin:0;color:var(--muted)}
.detail-card{max-width:790px;padding:28px;margin:auto}.crumb{display:inline-block;color:var(--wine);font-size:13px;font-weight:700;margin-bottom:15px}
.detail-card h1{font-size:clamp(22px,4vw,30px);margin:6px 0}.detail-card h2{font-size:18px;margin:24px 0 10px}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.kpi{padding:13px;background:#f8f8fa;border-radius:12px}.kpi b{display:block;font-size:22px;color:var(--wine)}.kpi span{font-size:12px;color:#657084}
.explain{border:1px solid #edcbd7;background:#fff6f8;border-radius:13px;padding:18px;margin:18px 0}.explain h3{font-size:17px;margin:0 0 7px;color:var(--wine)}.explain p{margin:0}
.hr{border:0;border-top:1px solid var(--line);margin:21px 0}.muted{color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:19px 0 5px}
.form-card{max-width:760px;margin:0 auto;padding:24px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}
.form-grid .field{margin:8px 0}.form-card h2{font-size:18px;margin:10px 0 8px}
.outcome{margin-top:22px}.outcome h2{margin:0 0 10px}.outcome .data-number{margin-top:4px}
.compare-table{width:100%;border-collapse:collapse;font-size:13px}.compare-table th,.compare-table td{border-bottom:1px solid #e6e9ee;padding:12px 10px;text-align:left;vertical-align:top}
.compare-table th{background:#f7f7f9;color:#657080}.table-scroller{overflow-x:auto}.compare-box{padding:24px;margin:0 auto;max-width:1000px}
footer{max-width:1130px;margin:auto;padding:22px 20px 32px;color:#7a8190;font-size:12px}
@media(max-width:780px){main{padding:17px 12px 100px}.header-inner{padding:9px 12px;min-height:66px}.logo{font-size:18px}.logo small{font-size:9px}nav{gap:0}nav a{padding:7px 8px;font-size:11px}.hero{padding:20px;border-radius:16px}.hero .bubble{display:none}.layout{grid-template-columns:1fr;gap:13px;margin-top:14px}.panel{position:static;padding:14px}.filter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 11px}.results{grid-template-columns:1fr;gap:11px}.detail-card,.form-card,.compare-box{padding:18px}.kpi-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi{padding:10px 7px}.kpi b{font-size:19px}.kpi span{font-size:10px}}
@media(max-width:440px){nav a{font-size:10px;padding:6px 5px}.header-inner{gap:6px}.logo{font-size:16px}.tile{padding:15px}.form-grid{grid-template-columns:1fr}.hero h1{font-size:23px}}
</style>
</head>
<body>
<header><div class="header-inner"><a class="logo" href="#/">すぐ埋まる？ナビ<small>国分寺市の賃貸掲載データから考える</small></a><nav id="nav" aria-label="メインメニュー"></nav></div></header>
<main id="app" aria-live="polite"></main>
<footer>研究で使用したLIFULL HOME'Sの過去掲載データを条件別に集計。現在の空室情報・物件広告・成約情報ではありません。</footer>
<script>
'use strict';
const app = document.getElementById('app');
const nav = document.getElementById('nav');
const threshold = 0.15;
let groups = [];
let loadState = 'loading';
let loadError = '';
const saved = new Set(JSON.parse(localStorage.getItem('riskSaved') || '[]').filter(Number.isInteger));
const state = {layout:'すべて',age:'すべて',rent:'すべて',level:'すべて',search:'',sort:'count',onlySaved:false};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function pct(n){return (n*100).toFixed(1)+'%';}
function number(n){return Number(n).toLocaleString('ja-JP');}
function badge(g){return '<span class="tag '+(g.level==='hi'?'high':'low')+'">'+(g.level==='hi'?'終わりやすい':'終わりにくい')+'</span>';}
function label(g){return g.layout+' / 築'+g.age_band+' / '+g.rent_band+'万円';}
function heading(h,t){return '<div class="intro"><h1>'+h+'</h1><p>'+t+'</p></div>';}
function notice(){return '<div class="notice"><strong>研究結果の読み方：</strong>1件のカードは「実在する1物件」ではなく、間取り・築年数帯・家賃帯が同じ複数物件の<strong>集計グループ</strong>です。過去12日間掲載されていた物件が、その後7日以内に掲載終了した割合を表示しています。掲載終了は成約を意味しません。</div>';}
function navRender(active){
 const tabs=[['#/','掲載データ'],['#/groups','集計結果'],['#/analyze','物件を分析'],['#/saved','キープ・比較']];
 nav.innerHTML=tabs.map(t=>'<a '+(active===t[0]?'class="active" aria-current="page" ':'')+'href="'+t[0]+'">'+t[1]+(t[0]==='#/saved'&&saved.size?' ('+saved.size+')':'')+'</a>').join('');
}
function optionHtml(values, selected){return values.map(x=>'<option value="'+esc(x)+'"'+(x===selected?' selected':'')+'>'+esc(x)+'</option>').join('');}
function unique(key){return ['すべて',...new Set(groups.map(x=>x[key]))];}
function filtered(){
 let a=groups.filter(g=>(state.layout==='すべて'||g.layout===state.layout)&&(state.age==='すべて'||g.age_band===state.age)&&(state.rent==='すべて'||g.rent_band===state.rent)&&(state.level==='すべて'||g.level===state.level)&&(!state.onlySaved||saved.has(g.id))&&(!state.search||label(g).toLowerCase().includes(state.search.toLowerCase())));
 return a.sort((x,y)=>state.sort==='rate'?y.day12_next7_rate-x.day12_next7_rate:state.sort==='median'?x.median_days-y.median_days:state.sort==='rent'?parseInt(x.rent_band)-parseInt(y.rent_band):y.count-x.count);
}
function card(g){
 return '<article class="tile"><div class="tile-top"><div><h3>'+esc(g.layout)+'・築'+esc(g.age_band)+'</h3><div class="price">家賃 '+esc(g.rent_band)+'万円</div></div>'+badge(g)+'</div>'+
 '<div class="data-number">'+pct(g.day12_next7_rate)+'<small>7日以内</small></div><div class="meter"><i style="width:'+Math.min(100,g.day12_next7_rate*100)+'%"></i></div>'+
 '<div class="meta"><span>掲載12日目からの過去の終了割合</span><span>過去の対象 <strong>'+number(g.count)+'件</strong> ／ 半数が掲載終了 <strong>'+g.median_days+'日</strong></span></div>'+
 '<div class="tile-buttons"><a class="btn" href="#/group/'+g.id+'">分析を見る</a><button type="button" class="btn alt save" data-save="'+g.id+'" aria-label="'+(saved.has(g.id)?'キープ解除':'キープ')+'" aria-pressed="'+saved.has(g.id)+'">'+(saved.has(g.id)?'♥':'♡')+'</button></div></article>';
}
function home(){
 navRender('#/groups');
 app.innerHTML='<section class="hero"><div><h1>気になる物件、<br>早めに問い合わせたほうがいい？</h1><p>国分寺市の賃貸掲載データから、条件ごとの「掲載が終わりやすさ」を比べられます。実際の研究データを使った分析ナビです。</p></div><div class="bubble"><strong>'+groups.length+'条件</strong><small>実データから作成した集計グループ</small></div></section>'+
 notice()+
 '<div class="layout"><aside class="panel"><h2>条件から探す</h2><div class="filter-grid">'+
 '<div class="field"><label for="filterSearch">キーワード</label><input id="filterSearch" placeholder="例：1K / 6〜8" value="'+esc(state.search)+'"></div>'+
 '<div class="field"><label for="filterLayout">間取り</label><select id="filterLayout">'+optionHtml(unique('layout'),state.layout)+'</select></div>'+
 '<div class="field"><label for="filterAge">築年数</label><select id="filterAge">'+optionHtml(unique('age_band'),state.age)+'</select></div>'+
 '<div class="field"><label for="filterRent">家賃帯</label><select id="filterRent">'+optionHtml(unique('rent_band'),state.rent)+'</select></div>'+
 '</div><div class="chips" role="group" aria-label="掲載の終わりやすさ"><button class="chip '+(state.level==='すべて'?'active':'')+'" data-level="すべて">すべて</button><button class="chip '+(state.level==='hi'?'active':'')+'" data-level="hi">終わりやすい</button><button class="chip '+(state.level==='lo'?'active':'')+'" data-level="lo">終わりにくい</button></div>'+
 '<label class="small"><input type="checkbox" id="onlySaved" '+(state.onlySaved?'checked':'')+'> キープした条件だけ</label><div style="margin-top:15px"><button class="reset" id="resetFilters">絞り込みをリセット</button></div></aside>'+
 '<section><div class="section-head"><div><h2>研究データ一覧</h2><div class="count" id="resultCount"></div></div><label class="small">並び替え <select id="sort" style="min-width:180px"><option value="count">対象件数の多い順</option><option value="rate">終了割合の高い順</option><option value="median">終了中央値の短い順</option><option value="rent">家賃帯の低い順</option></select></label></div><div class="results" id="results"></div></section></div>';
 document.getElementById('sort').value=state.sort;
 updateResults();
}
function updateResults(){
 const container=document.getElementById('results');if(!container)return;
 const a=filtered();
 document.getElementById('resultCount').innerHTML='<b>'+a.length+'</b> / '+groups.length+' 条件を表示';
 container.innerHTML=loadState==='loading'?'<div class="empty">研究データを読み込み中です。</div>':loadState==='error'?'<div class="empty">読み込みに失敗しました：'+esc(loadError)+'<p><button class="btn" id="retry">再試行</button></p></div>':a.length?a.map(card).join(''):'<div class="empty">条件に合う集計グループがありません。<p><button class="btn" id="resetFilters">条件をリセット</button></p></div>';
}
function detail(id){
 const g=groups.find(x=>x.id===id);
 if(!g){
  if(loadState==='loading'){navRender('#/');app.innerHTML='<div class="empty">分析データを読み込み中です。</div>';return;}
  if(loadState==='error'){navRender('#/');app.innerHTML='<div class="empty">分析データを読み込めませんでした。<p><a class="btn" href="#/">一覧に戻る</a></p></div>';return;}
  location.hash='#/';return;
 }
 navRender('#/');
 const recommendation=g.level==='hi'?'問い合わせを早めに検討する材料になります':'ほかの条件と比較しながら検討できます';
 app.innerHTML='<div class="detail-card"><a class="crumb" href="#/">← 研究データ一覧へ</a><h1>'+esc(g.layout)+'・築'+esc(g.age_band)+'</h1><div class="price">家賃 '+esc(g.rent_band)+'万円</div><p class="muted">国分寺市の過去'+number(g.count)+'件を集計した条件です。</p>'+
 '<div class="explain"><div>'+badge(g)+'</div><div class="data-number">'+pct(g.day12_next7_rate)+'</div><p>掲載から12日経っても掲載中だった同条件の物件が、その後7日以内に掲載終了した割合です。</p><hr class="hr"><h3>'+recommendation+'</h3><p>今回の表示では、7日以内の掲載終了割合が15%以上なら「終わりやすい」、15%未満なら「終わりにくい」としています。問い合わせの成否を予測するものではありません。</p></div>'+
 '<h2>似た条件の物件は、何日で掲載終了した？</h2><p class="muted">掲載開始から終了までの期間について、過去'+number(g.count)+'件の分布を表示しています。</p>'+
 '<div class="kpi-grid"><div class="kpi"><b>'+g.quarter_days+'日</b><span>25%が終了</span></div><div class="kpi"><b>'+g.median_days+'日</b><span>半数が終了</span></div><div class="kpi"><b>'+g.three_quarter_days+'日</b><span>75%が終了</span></div></div>'+
 '<h2>問い合わせを考えるときの見方</h2><p>この条件の過去データでは、掲載終了の割合が'+pct(g.day12_next7_rate)+'でした。ほかの候補と比べて早めに確認するか、家賃・広さ・立地も含めて判断してみてください。</p>'+
 '<div class="notice"><strong>注意：</strong>この結果は「間取り・築年数帯・家賃帯」でまとめた過去実績です。駅・面積などを加味した個別予測ではありません。掲載終了と成約は同じではありません。</div>'+
 '<div class="actions"><button class="btn" data-save="'+g.id+'">'+(saved.has(g.id)?'♥ キープ解除':'♡ この条件をキープ')+'</button><a class="btn alt" href="#/saved">キープした条件を比較</a><a class="btn alt" href="#/analyze">自分の物件を分析</a></div></div>';
}
function savedPage(){
 navRender('#/saved');
 const list=groups.filter(g=>saved.has(g.id));
 app.innerHTML=heading('キープ・比較','気になった条件の過去の掲載終了割合や掲載期間を並べて比べられます。')+
 '<div class="compare-box">'+(list.length?'<div class="table-scroller"><table class="compare-table"><thead><tr><th>条件</th><th>7日以内の終了割合</th><th>過去件数</th><th>半数が終了</th><th>終わりやすさ</th><th></th></tr></thead><tbody>'+
 list.map(g=>'<tr><td><a href="#/group/'+g.id+'" style="color:var(--wine);font-weight:700">'+esc(label(g))+'</a></td><td><strong>'+pct(g.day12_next7_rate)+'</strong></td><td>'+number(g.count)+'</td><td>'+g.median_days+'日</td><td>'+badge(g)+'</td><td><button class="reset" data-save="'+g.id+'">削除</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">まだキープした条件がありません。<p><a class="btn" href="#/">研究データから探す</a></p></div>')+'</div>';
}
function analysisForm(){
 navRender('#/analyze');
 app.innerHTML=heading('気になる物件を分析','自分が見つけた賃貸物件の条件を入力して、7日以内に掲載が終わりやすいかを調べます。')+
 '<section class="panel form-card" style="position:static"><h2>物件の条件</h2><form id="analysisForm"><div class="form-grid">'+
 '<div class="field"><label for="layout">間取り</label><select id="layout" name="layout" required>'+optionHtml(['1R','1K','1DK','1LDK','2DK','2LDK','3DK','3LDK'], '1K')+'</select></div>'+
 '<div class="field"><label for="rent_man">家賃（万円）</label><input id="rent_man" name="rent_man" type="number" step="0.1" min="0.1" max="300" value="7.2" required></div>'+
 '<div class="field"><label for="age">築年数</label><input id="age" name="age" type="number" step="0.1" min="0" max="150" value="7" required></div>'+
 '<div class="field"><label for="area">専有面積（㎡）</label><input id="area" name="area" type="number" step="0.1" min="1" max="1000" value="22" required></div>'+
 '<div class="field"><label for="station">最寄駅（正式な駅名）</label><input id="station" name="station" value="国分寺" maxlength="100" required></div>'+
 '<div class="field"><label for="walk_distance">駅徒歩（分）</label><input id="walk_distance" name="walk_distance" type="number" step="1" min="0" max="120" value="6" required></div>'+
 '<div class="field"><label for="elapsed_day">掲載からの日数</label><input id="elapsed_day" name="elapsed_day" type="number" step="1" min="0" max="365" value="12" required></div>'+
 '<div class="field"><label for="start_month">掲載開始月</label><select id="start_month" name="start_month">'+Array.from({length:12},(_,i)=>'<option value="'+(i+1)+'"'+(i===5?' selected':'')+'>'+(i+1)+'月</option>').join('')+'</select></div>'+
 '</div><p class="small">※駅名は研究データに含まれる名前と一致するよう入力してください。近い条件の集計には間取り・築年数・家賃帯のみを使用します。</p>'+
 '<button class="btn" type="submit" style="width:100%;margin-top:10px">終わりやすさを分析する</button></form><div id="analysisOutput" aria-live="polite"></div></section>'+
 '<div class="notice" style="max-width:760px;margin:18px auto"><strong>予測について：</strong>研究モデルのファイルがローカルにあればモデル推論を使います。なければ過去実績だけを表示し、個別物件の予測値を作りません。</div>';
}
async function submitAnalysis(form){
 const el=document.getElementById('analysisOutput');
 el.innerHTML='<div class="notice">分析中...</div>';
 const raw=Object.fromEntries(new FormData(form).entries());
 const req={layout:raw.layout,station:raw.station,rent_man:Number(raw.rent_man),age:Number(raw.age),area:Number(raw.area),walk_distance:Number(raw.walk_distance),elapsed_day:Number(raw.elapsed_day),start_month:Number(raw.start_month)};
 try{
  const res=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(req)});
  const response=await res.json();
  if(!res.ok)throw new Error(response.detail||'APIエラー '+res.status);
  const model=response.mode==='model',hist=response.historical;
  const predicted=model?'<div class="data-number">'+pct(response.risk)+'<small>7日以内のモデル予測</small></div>':'<p>学習済みモデルによる個別予測値は表示できません。</p>';
  const history=hist?'<h2>似た条件の過去実績</h2><div class="kpi-grid"><div class="kpi"><b>'+number(hist.count)+'件</b><span>集計対象</span></div><div class="kpi"><b>'+hist.median_days_from_start+'日</b><span>半数が掲載終了</span></div><div class="kpi"><b>'+pct(hist.day12_next7_rate)+'</b><span>掲載12日目から7日以内に終了</span></div></div><p class="small">この割合は掲載12日目を基準にした条件別実績であり、入力した経過日数に応じた個別予測ではありません。</p>':'<p>一致する条件の集計（100件以上）がないため、過去実績は表示できません。</p>';
  el.innerHTML='<div class="outcome"><hr class="hr"><div class="explain"><h2>'+esc(response.heading)+'</h2>'+predicted+'<p>'+esc(response.reason)+'</p><p class="small">分析方法：'+(model?'保存済みの研究モデルによる推論':'GitHub上の過去集計のみ')+'</p></div>'+history+'<div class="notice"><strong>判断の注意：</strong>'+esc(response.caution)+'</div></div>';
 }catch(err){el.innerHTML='<div class="notice"><strong>分析できませんでした：</strong>'+esc(err.message)+'。サーバーのログと学習モデルのバージョンを確認してください。</div>';}
}

const listingState={ready:null,total:0,page:1,limit:24,items:[],error:'',loading:false,layout:'',rentMax:'',ageMax:'',query:''};
function listingCard(p){
 const details=[p.area!=null?p.area+'㎡':null,p.station?p.station+'駅':null,p.walk_distance!=null?'徒歩'+p.walk_distance+'分':null].filter(Boolean).join('・');
 return '<article class="tile"><div class="tile-top"><div><h3>'+(p.layout?esc(p.layout):'間取り未記録')+'・'+(p.age!=null?'築'+p.age.toFixed(1)+'年':'築年数不明')+'</h3><div class="price">'+(p.rent_man!=null?p.rent_man.toFixed(1)+'万円':'家賃不明')+'</div></div><span class="tag low">過去掲載</span></div>'+
 '<p class="small">'+esc(details||'駅・面積の情報なし')+'</p><div class="meta">掲載開始：'+esc(p.start_date||'不明')+'<br>掲載終了：'+esc(p.end_date||'不明')+'<br>掲載日数：'+(p.duration!=null?p.duration+'日':'不明')+'</div>'+
 '<div class="tile-buttons"><a class="btn" href="#/listing/'+p.id+'">詳細・分析</a></div></article>';
}
function listingsPage(){
 navRender('#/');
 const content=listingState.ready===false?'<div class="empty"><strong>個別物件データがまだ紐づいていません。</strong><p>PCにある抽出済みのCSV.GZまたはParquetをアプリに設定すると、個別掲載レコードをここに表示できます。</p><a class="btn" href="#/groups">いま使える研究の集計結果を見る</a><p class="small">指定方法：サーバー起動前に KOKUBUNJI_DATA_PATH にローカルファイルのパスを設定してください。</p></div>':
 listingState.error?'<div class="empty">個別データの読み込みに失敗：'+esc(listingState.error)+'<p><button class="btn" id="reloadListings">再試行</button></p></div>':
 listingState.loading?'<div class="empty">ローカルの掲載記録を読み込み中...</div>':
 listingState.items.length?'<div class="results">'+listingState.items.map(listingCard).join('')+'</div>':
 '<div class="empty">該当する掲載記録がありません。</div>';
 const pages=Math.max(1,Math.ceil(listingState.total/listingState.limit));
 app.innerHTML='<div class="intro"><h1>国分寺市の過去掲載データ</h1><p>抽出済みの実際の掲載記録を読み込み、気になる物件を探して分析できます。</p></div>'+
 '<div class="notice"><strong>重要：</strong>表示するのは2020〜2023年の過去の掲載記録です。現在募集している物件ではありません。また、過去の掲載終了は成約を意味しません。</div>'+
 '<div class="layout"><aside class="panel"><h2>物件を探す</h2><form id="listingFilterForm" class="filter-grid">'+
 '<div class="field"><label for="lq">間取り・駅名</label><input id="lq" name="query" value="'+esc(listingState.query)+'" placeholder="例：国分寺 / 1K"></div>'+
 '<div class="field"><label for="ll">間取り</label><select id="ll" name="layout">'+optionHtml(['すべて','1R','1K','1DK','1LDK','2DK','2LDK','3DK','3LDK'],listingState.layout||'すべて')+'</select></div>'+
 '<div class="field"><label for="lr">家賃上限（万円）</label><input id="lr" type="number" name="rent_max" value="'+esc(listingState.rentMax)+'" step="0.5" min="0" placeholder="指定なし"></div>'+
 '<div class="field"><label for="la">築年数上限（年）</label><input id="la" type="number" name="age_max" value="'+esc(listingState.ageMax)+'" step="1" min="0" placeholder="指定なし"></div>'+
 '<button class="btn" type="submit">この条件で探す</button></form><p class="small">データがない場合は<a style="color:var(--wine)" href="#/groups">研究集計の40条件</a>も参照できます。</p></aside>'+
 '<section><div class="section-head"><div><h2>掲載記録一覧</h2><div class="count"><b>'+number(listingState.total)+'</b> 件'+(listingState.ready===true?'（読み込み済み）':'')+'</div></div></div>'+
 content+
 (listingState.ready&&listingState.total?'<div class="actions" style="align-items:center;justify-content:center"><button class="btn alt" id="listingPrev" '+(listingState.page===1?'disabled':'')+'>前へ</button><span class="small">'+listingState.page+' / '+pages+' ページ</span><button class="btn alt" id="listingNext" '+(listingState.page>=pages?'disabled':'')+'>次へ</button></div>':'')+
 '</section></div>';
}
async function fetchListings(){
 listingState.loading=true;listingState.error='';
 listingsPage();
 try{
  const q=new URLSearchParams({page:String(listingState.page),limit:String(listingState.limit)});
  if(listingState.layout)q.set('layout',listingState.layout);
  if(listingState.rentMax!=='')q.set('rent_max',listingState.rentMax);
  if(listingState.ageMax!=='')q.set('age_max',listingState.ageMax);
  if(listingState.query)q.set('query',listingState.query);
  const response=await fetch('/api/listings?'+q);
  const data=await response.json();
  if(!response.ok)throw new Error(data.detail||response.status);
  Object.assign(listingState,{ready:data.ready,total:data.total,items:data.items});
 }catch(e){listingState.error=e.message;listingState.ready=null;listingState.items=[];}
 listingState.loading=false;
 if((location.hash||'#/')==='#/')listingsPage();
}
let currentListing=null;
async function listingDetail(id){
 navRender('#/');
 app.innerHTML='<div class="empty">掲載記録を読み込み中...</div>';
 try{
  const response=await fetch('/api/listings/'+id);
  const data=await response.json();
  if(!response.ok)throw new Error(data.detail||response.status);
  if(location.hash!=='#/listing/'+id)return;
  currentListing=data;
  app.innerHTML='<div class="detail-card"><a class="crumb" href="#/">← 掲載記録一覧へ</a><h1>'+(data.layout?esc(data.layout):'間取り不明')+'・'+(data.age!=null?'築'+data.age.toFixed(1)+'年':'築年数不明')+'</h1><p class="price">'+(data.rent_man!=null?data.rent_man+'万円':'家賃不明')+'</p>'+
  '<p>駅：'+esc(data.station||'不明')+' ／ 徒歩'+(data.walk_distance??'不明')+'分 ／ '+(data.area??'不明')+'㎡</p>'+
  '<div class="kpi-grid"><div class="kpi"><b>'+esc(data.start_date||'不明')+'</b><span>掲載開始日</span></div><div class="kpi"><b>'+esc(data.end_date||'不明')+'</b><span>掲載終了日</span></div><div class="kpi"><b>'+(data.duration??'不明')+'日</b><span>記録された掲載期間</span></div></div>'+
  '<div class="notice">過去の掲載期間は実績であり、その物件が掲載中だった時点での将来予測を意味しません。予測には掲載経過日数などを入力します。</div>'+
  '<div class="actions"><button class="btn" id="analyzeListing">この条件でリスクを分析</button><a class="btn alt" href="#/groups">似た条件の過去集計を見る</a></div>'+
  '<p class="small">抽出ファイルに駅名・面積・築年数などが含まれない場合は、分析画面で不足する項目を自分で入力してください。</p></div>';
 }catch(e){app.innerHTML='<div class="empty">'+esc(e.message)+'<p><a class="btn" href="#/">一覧に戻る</a></p></div>';}
}

function render(){
 const h=location.hash||'#/';
 window.scrollTo(0,0);
 if(h==='#/'||h==='#')listingsPage();
 else if(h==='#/groups')home();
 else if(/^#\/listing\/\d+$/.test(h))listingDetail(Number(h.split('/').pop()));
 else if(h==='#/saved')savedPage();
 else if(h==='#/analyze')analysisForm();
 else if(/^#\/group\/\d+$/.test(h))detail(Number(h.split('/').pop()));
 else{location.hash='#/';}
}
async function loadGroups(){
 loadState='loading';loadError='';render();
 try{
  const response=await fetch('/api/groups');
  if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json();
  if(!Array.isArray(data.groups))throw new Error('集計データの形式が不正');
  groups=data.groups;loadState='ok';
 }catch(err){loadState='error';loadError=err.message;}
 render();
}
document.addEventListener('click',event=>{
 const save=event.target.closest('[data-save]');
 if(save){const id=Number(save.dataset.save);saved.has(id)?saved.delete(id):saved.add(id);localStorage.setItem('riskSaved',JSON.stringify([...saved]));render();return;}
 const level=event.target.closest('[data-level]');
 if(level){state.level=level.dataset.level;home();return;}
 if(event.target.closest('#resetFilters')){Object.assign(state,{layout:'すべて',age:'すべて',rent:'すべて',level:'すべて',search:'',sort:'count',onlySaved:false});home();return;}
 if(event.target.closest('#retry'))loadGroups();
 if(event.target.closest('#reloadListings'))fetchListings();
 if(event.target.closest('#listingPrev')){if(listingState.page>1){listingState.page--;fetchListings();}return;}
 if(event.target.closest('#listingNext')){if(listingState.page*listingState.limit<listingState.total){listingState.page++;fetchListings();}return;}
 if(event.target.closest('#analyzeListing')&&currentListing){const x=currentListing;location.hash='#/analyze';requestAnimationFrame(()=>{for(const [key,val] of Object.entries({layout:x.layout,age:x.age,rent_man:x.rent_man,area:x.area,station:x.station,walk_distance:x.walk_distance,start_month:x.start_month,elapsed_day:12})){const el=document.querySelector('#analysisForm [name="'+key+'"]');if(el)el.value=(val===null||val===undefined?'':val);} });return;}
});
document.addEventListener('change',event=>{
 const mapping={filterLayout:'layout',filterAge:'age',filterRent:'rent',sort:'sort'};
 const key=mapping[event.target.id];
 if(key){state[key]=event.target.value;if(key==='sort')updateResults();else home();}
 if(event.target.id==='onlySaved'){state.onlySaved=event.target.checked;updateResults();}
});
document.addEventListener('input',event=>{
 if(event.target.id==='filterSearch'){state.search=event.target.value;updateResults();}
});
document.addEventListener('submit',event=>{
 if(event.target.id==='analysisForm'){event.preventDefault();submitAnalysis(event.target);}
 if(event.target.id==='listingFilterForm'){event.preventDefault();const x=Object.fromEntries(new FormData(event.target).entries());Object.assign(listingState,{query:x.query,layout:x.layout==='すべて'?'':x.layout,rentMax:x.rent_max,ageMax:x.age_max,page:1});fetchListings();}
});
window.addEventListener('hashchange',render);
loadGroups();
fetchListings();
</script>
</body>
</html>
